server {
    listen 80;
    server_name tasktide.live www.tasktide.live;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name tasktide.live www.tasktide.live;
    root /var/www/html;
    index index.php index.html;
    ssl_certificate /etc/letsencrypt/live/tasktide.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tasktide.live/privkey.pem;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass wordpress:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
